.check: &check
  name: workspace-check
  docker:
    image: node:latest
  services:
    - docker
  stages:
    - &install-pnpm
      name: install-pnpm
      script: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
    - &install-dependencies
      name: install-dependencies
      script: pnpm install --frozen-lockfile
    - &check-workspace
      name: check-workspace
      script: pnpm check
    - &build-image
      name: build-image
      script: docker build --label org.opencontainers.image.revision=${CNB_COMMIT} -t cool-profile:verify .
    - &verify-image
      name: verify-image
      script: node scripts/verify-image.mjs cool-profile:verify

.native-image: &native-image
  docker:
    image: node:latest
  services:
    - docker
  stages:
    - name: build-native-image
      script: >-
        docker build --platform linux/${BUILD_ARCH}
        --label org.opencontainers.image.revision=${CNB_COMMIT}
        -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}-linux-${BUILD_ARCH} .
    - name: verify-native-image
      script: node scripts/verify-image.mjs ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}-linux-${BUILD_ARCH} linux/${BUILD_ARCH}
    - name: push-native-image
      script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}-linux-${BUILD_ARCH}

main:
  push:
    - <<: *check
      lock:
        key: publish-cool-profile-edge
        wait: true
        cancel-in-wait: true
      stages:
        - *install-pnpm
        - *install-dependencies
        - *check-workspace
        - name: build-native-images
          jobs:
            amd64:
              type: cnb:apply
              options:
                event: api_trigger_image_amd64
                sync: true
            arm64:
              type: cnb:apply
              options:
                event: api_trigger_image_arm64
                sync: true
        - name: publish-edge
          script: |
            docker buildx imagetools create -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT} ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}-linux-amd64 ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}-linux-arm64
            docker buildx imagetools create -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:edge ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}
        - name: generate-with-published-plugin
          image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:edge
          args: [render]
          settings:
            card: repository/overview
            params: { source: cnb, subject: $CNB_REPO_SLUG }
            format: png
            output: .cache/plugin-smoke.png

$:
  api_trigger_image_amd64:
    - <<: *native-image
      name: build-amd64
      runner:
        tags: cnb:arch:amd64
      env:
        BUILD_ARCH: amd64
  api_trigger_image_arm64:
    - <<: *native-image
      name: build-arm64
      runner:
        tags: cnb:arch:arm64:v8
      env:
        BUILD_ARCH: arm64
  pull_request:
    - *check
