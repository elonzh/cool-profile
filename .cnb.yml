.check: &check
  name: workspace-check
  docker:
    image: node:latest
  services:
    - docker
  stages:
    - &install-pnpm
      name: install-pnpm
      script: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
    - &install-dependencies
      name: install-dependencies
      script: pnpm install --frozen-lockfile
    - &check-workspace
      name: check-workspace
      script: pnpm check
    - &build-image
      name: build-image
      script: docker build --label org.opencontainers.image.revision=${CNB_COMMIT} -t cool-profile:verify .
    - &verify-image
      name: verify-image
      script: node scripts/verify-image.mjs cool-profile:verify

main:
  push:
    - <<: *check
      lock:
        key: publish-cool-profile
        wait: true
        cancel-in-wait: true
      stages:
        - *install-pnpm
        - *install-dependencies
        - *check-workspace
        - *build-image
        - *verify-image
        - name: publish-image
          script: |
            docker tag cool-profile:verify ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}
            docker tag cool-profile:verify ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest

$:
  pull_request:
    - *check
