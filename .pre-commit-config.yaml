minimum_prek_version: 0.4.5
default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: Oxfmt
        entry: pnpm exec oxfmt
        language: system
        files: '\.([cm]?[jt]sx?|jsonc?|ya?ml|md|html|css)$'
      - id: oxlint
        name: Oxlint
        entry: pnpm exec oxlint --fix --deny-warnings
        language: system
        files: '\.[cm]?[jt]sx?$'
