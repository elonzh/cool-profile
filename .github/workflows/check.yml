name: Workspace check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workspace
        run: pnpm check
      - name: Verify npm distribution
        run: pnpm release:pack && pnpm release:verify
  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build application image
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t cool-profile:verify .
      - name: Verify packaged application
        run: node scripts/verify-image.mjs cool-profile:verify
